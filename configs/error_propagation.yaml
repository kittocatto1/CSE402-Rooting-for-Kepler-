# Work Plan step 4 - solver tolerance -> fitted orbital parameters.
# Owner: Fariha.
name: error_propagation

solvers: [newton, danby, markley, nwm9, nwm11]
guesses: [canonical]

max_iter: 50
seed: 0

extra:
  # HD 164922: 401 points across 3 instruments, real cadence/uncertainties;
  # see rv/dataset.py and data/README.md. A moderately eccentric orbit is
  # INJECTED in place of the real (multi-planet, single-planet-model-
  # degenerate) signal - see the module docstring in
  # experiments/error_propagation.py for why. (k2-24 also works - smaller,
  # single-instrument, useful for quick debugging.)
  dataset: hd164922
  tolerance_sweep: [1.0e-4, 1.0e-6, 1.0e-8, 1.0e-10, 1.0e-12, 1.0e-14]
  reference_tolerance: 1.0e-14
  # One MCMC run supplies the posterior widths; the tolerance sweep uses
  # maximum-likelihood fits only.
  run_mcmc: true
  # 2000 steps is a debug/CI-scale budget (~5-10s, serial, 32 points, 4-5
  # free parameters); raise for the real run and record whatever N is used.
  mcmc_steps: 2000

  # The orbit injected in place of the real (multi-planet, single-planet-
  # model-degenerate) signal - P is HD 164922's/K2-24's real, well-known
  # period; tp/e/omega/K are a deliberately-chosen, moderately eccentric
  # synthetic orbit, NOT a claim about the real planet's orbit. Must match
  # monte_carlo.yaml's injected_truth to be studying the same fit.
  injected_truth: {P: 20.885258, tp: 2400.0, e: 0.35, omega: 1.0, K: 5.0, gamma: 0.0}
  # Deliberately offset from injected_truth so every fit has to do real work
  # to recover it, rather than starting on the answer.
  initial_guess: {P: 20.885258, tp: 2400.0, e: 0.15, omega: 0.3, K: 3.0, gamma: 0.0}
