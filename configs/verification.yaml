# Work Plan step 2 - validate each implementation against its source paper.
# Owner: Suchi.
name: verification

solvers: [newton, danby, nwm9, nwm11]   # markley has no asymptotic order
guesses: [simple]

# tol = 0 forces the loop to run exactly max_iter iterations, which is what
# the convergence-order estimator needs (no early exit).
tol: 0.0
max_iter: 8
record_history: true
use_reference: true

extra:
  # The order estimate needs far more than double precision for the
  # high-order methods: an order-9 method passes 1e-9, 1e-81, 1e-729 in three
  # steps, and the estimator needs three usable errors for one estimate.
  # Calibrated on NWM9 - at 100 dps the measured order comes out anywhere in
  # 8.87-10.19 (only 3 usable terms); at 2000 it settles to 8.87-8.98 against
  # a claim of 8.8989, and 3000 buys nothing. Costs ~2 s for the whole set.
  working_precision_dps: 2000
  # Small controlled Kepler set used by verify_kepler_correctness.
  kepler_check_points: 5000
  # The correctness sweep needs a REAL stopping tolerance. It cannot use the
  # tol above: that is 0.0 on purpose, to stop the order run exiting early,
  # and a solver given tol=0 would just spin to max_iter everywhere.
  kepler_check_tol: 1.0e-13
